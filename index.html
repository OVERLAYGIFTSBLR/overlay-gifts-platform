<!DOCTYPE html>
<html>
<head>

<title>Create AR Gift</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- External CSS -->
<link rel="stylesheet" href="style.css">

<style>

body{
font-family:Arial;
text-align:center;
padding:40px;
}

.container{
max-width:400px;
margin:auto;
}

button{
background:#c89b3c;
border:none;
padding:12px;
width:100%;
font-size:16px;
color:white;
border-radius:6px;
}

</style>

</head>

<body>

<div class="container">

<h2>Create AR Gift</h2>

<form id="uploadForm">

<p>Upload Image (AR Marker)</p>
<input type="file" id="image" accept="image/*" required>

<p>Upload Video</p>
<input type="file" id="video" accept="video/*" required>

<br><br>

<button type="submit">Generate AR Gift</button>

</form>

<br>

<div id="result"></div>

</div>

<script>

document.getElementById("uploadForm").addEventListener("submit", async function(e){

e.preventDefault()

let image = document.getElementById("image").files[0]
let video = document.getElementById("video").files[0]

let formData = new FormData()

formData.append("image",image)
formData.append("video",video)

let response = await fetch("PASTE_GOOGLE_SCRIPT_URL_HERE",{
method:"POST",
body:formData
})

let data = await response.json()

document.getElementById("result").innerHTML=

`
<p>AR Link</p>
<a href="${data.link}" target="_blank">${data.link}</a>

<p>QR Code</p>
<img src="${data.qr}">
`

})

</script>

<!-- External JavaScript -->
<script src="script.js"></script>

</body>
</html>
